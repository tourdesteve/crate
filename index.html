<script>
{
const C=window.Crate,{esc,store,$}=C;
const CLIENT_ID='';
const REDIRECT=location.origin+location.pathname;
const SCOPES='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
let sp=store.get('spotify')||{};
const save=()=>store.set('spotify',sp);
const clientId=()=>sp.clientId||CLIENT_ID;
// Connections made before each user brought their own Client ID used the original Crate app's ID.
if(sp.refresh&&!sp.clientId){sp.clientId='9cc417125215432498310013f96eb2a6';save()}
const useCrate=()=>connected()&&C.service()==='spotify';
const connected=()=>!!sp.refresh;
let sdkPlayer=null,sdkDevice=null,sdkErr='',state=null,pollT=0;

/* ---------- auth (PKCE) ---------- */
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  if(!clientId()){openConnect();return}
  const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  store.set('spv',v);
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  const q=new URLSearchParams({client_id:clientId(),response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,scope:SCOPES});
  location.href='https://accounts.spotify.com/authorize?'+q;
}
async function tokenReq(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:clientId(),...params})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.error||'Spotify sign-in failed');
  sp.access=j.access_token;sp.exp=Date.now()+j.expires_in*1000;if(j.refresh_token)sp.refresh=j.refresh_token;save();
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search);
  if(!p.has('code')&&!p.has('error'))return;
  history.replaceState(null,'',REDIRECT);
  if(p.get('error')){C.toast(p.get('error')==='access_denied'?'Spotify connection cancelled':'Spotify: '+p.get('error'));return}
  try{await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,code_verifier:store.get('spv')||''});store.del('spv');C.toast('Spotify connected');startPlayer();poll()}
  catch(e){C.toast(e.message)}
}
async function token(){
  if(sp.access&&Date.now()<sp.exp-60000)return sp.access;
  if(!sp.refresh)throw new Error('Connect Spotify first');
  try{await tokenReq({grant_type:'refresh_token',refresh_token:sp.refresh})}
  catch(e){sp={clientId:sp.clientId};save();updateUI();throw new Error('Spotify signed you out. Open Settings to reconnect.')}
  return sp.access;
}
async function api(path,opt={},retry=true){
  const t=await token();
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401&&retry){sp.access='';return api(path,opt,false)}
  if(r.status===204||r.status===202)return null;
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error(j?.error?.message||('Spotify error '+r.status));e.reason=j?.error?.reason;e.status=r.status;throw e}
  return j;
}

/* ---------- in-browser player (computers) ---------- */
function startPlayer(){
  if(!connected()||sdkPlayer||window.__spLoading)return;
  window.__spLoading=1;
  window.onSpotifyWebPlaybackSDKReady=()=>{
    sdkPlayer=new Spotify.Player({name:'Crate',getOAuthToken:cb=>token().then(cb).catch(()=>{}),volume:.8});
    sdkPlayer.addListener('ready',({device_id})=>{sdkDevice=device_id});
    sdkPlayer.addListener('initialization_error',({message})=>{sdkErr=message});
    sdkPlayer.addListener('playback_error',({message})=>{sdkErr=message});
    sdkPlayer.addListener('not_ready',()=>{sdkDevice=null});
    sdkPlayer.addListener('player_state_changed',()=>setTimeout(poll,300));
    sdkPlayer.addListener('authentication_error',({message})=>console.warn(message));
    sdkPlayer.addListener('account_error',()=>C.toast('Playing in Crate needs Spotify Premium'));
    sdkPlayer.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(s);
}

/* ---------- finding albums ---------- */
const norm=t=>String(t||'').toLowerCase().replace(/\s*[\[(].*?[\])]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim();
const toks=t=>norm(t).split(' ').filter(w=>w&&!['the','a','an','and','of'].includes(w));
const overlap=(a,b)=>{const A=toks(a),B=new Set(toks(b));if(!A.length||!B.size)return 0;return A.filter(w=>B.has(w)).length/Math.max(A.length,B.size)};
function scoreAlbum(x,a,artist,various){
  const tn=norm(a.name),xt=norm(x.title),an=norm((a.artists||[]).map(z=>z.name).join(' ')),xa=norm(artist);
  let t=0,ar=0;
  if(tn===xt)t=5;else if(tn&&xt&&(tn.startsWith(xt)||xt.startsWith(tn)))t=3;else{const o=overlap(x.title,a.name);t=o>=.6?3:o>=.3?1:0}
  if(various||(an&&xa&&(an.includes(xa)||xa.includes(an))))ar=4;else{const o=overlap(artist,(a.artists||[]).map(z=>z.name).join(' '));ar=o>=.5?3:0}
  let sc=t+ar+(a.album_type==='album'?1:0)+(x.year&&a.release_date?.startsWith(String(x.year))?1:0);
  return {sc,t,ar};
}
const hitOf=a=>({uri:a.uri,url:a.external_urls?.spotify,name:a.name,artist:(a.artists||[]).map(z=>z.name).join(', '),year:(a.release_date||'').slice(0,4),img:(a.images||[]).slice(-1)[0]?.url||'',type:a.album_type});
async function findAlbum(x,force){
  const cache=store.get('spAlbums')||{};
  if(cache[x.id]&&!force)return cache[x.id];
  const artist=x.artist.split(', ')[0].replace(/\s*\(\d+\)$/,''),various=/^various/i.test(artist);
  const tries=[various?`album:${norm(x.title)}`:`album:${norm(x.title)} artist:${norm(artist)}`,`${various?'':artist+' '}${norm(x.title)}`,norm(x.title)];
  if(!various)tries.push(artist);
  const seen=new Map();
  for(const q of tries){
    let res;try{res=await api('/search?type=album&limit=10&q='+encodeURIComponent(q))}catch(e){if(seen.size)break;throw e}
    for(const a of res?.albums?.items||[]){if(!a||seen.has(a.uri))continue;seen.set(a.uri,{a,...scoreAlbum(x,a,artist,various)})}
    const top=[...seen.values()].sort((p,q)=>q.sc-p.sc)[0];
    if(!force&&top&&top.t>=3&&top.ar>=3)break;
  }
  const ranked=[...seen.values()].sort((p,q)=>q.sc-p.sc);
  const top=ranked[0];
  if(!force&&top&&top.t>=3&&top.ar>=3){const hit=hitOf(top.a);cache[x.id]=hit;store.set('spAlbums',cache);return hit}
  return {pick:true,candidates:ranked.slice(0,8).map(r=>hitOf(r.a))};
}
function pickSheet(x,cands,onPick){
  C.openSheet(`<h4>Which one is it?</h4><p class="sp-note">Spotify doesn’t have an exact match for <b style="color:var(--ink)">${esc(x.title)}</b> by ${esc(x.artist)}. Pick the closest version; Crate will remember it.</p>
  ${cands.length?`<ul class="devlist picks">${cands.map((c,i)=>`<li><button data-i="${i}" style="justify-content:flex-start;gap:12px;padding:8px 10px">${c.img?`<img src="${esc(c.img)}" alt="" style="width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none">`:''}<span>${esc(c.name)}<br><small>${esc(c.artist)}${c.year?' · '+esc(c.year):''}${c.type&&c.type!=='album'?' · '+esc(c.type):''}</small></span></button></li>`).join('')}</ul>`:'<p class="sp-note">Spotify didn’t return anything for this record. It may not be on Spotify.</p>'}
  <div class="row2"><a class="btn ghost" href="${esc(C.spotifyURL(x))}" target="_blank" rel="noopener">Search in Spotify</a><button class="btn ghost" id="spClose">Close</button></div>`);
  $('#spClose').onclick=C.closeSheet;
  document.querySelectorAll('.picks button').forEach(b=>b.onclick=()=>{const c=cands[+b.dataset.i];const cache=store.get('spAlbums')||{};cache[x.id]=c;store.set('spAlbums',cache);C.closeSheet();onPick(c)});
}

/* ---------- devices ---------- */
async function devices(){return (await api('/me/player/devices'))?.devices||[]}
async function pickDevice(){
  const list=await devices();
  const chosen=store.get('spDevice');
  const crate=sdkDevice&&(list.find(d=>d.id===sdkDevice)||{id:sdkDevice,name:'Crate'});
  if(IOS){
    const phone=list.find(d=>d.id===chosen)||crate||list.find(d=>d.type==='Smartphone'&&d.is_active)||list.find(d=>d.type==='Smartphone');
    return phone||{none:true,others:list};
  }
  return list.find(d=>d.id===chosen)
    ||crate
    ||list.find(d=>d.is_active)
    ||(sdkDevice&&{id:sdkDevice,name:'Crate'})
    ||list[0]||null;
}
function wakeSheet(album,others=[]){
  C.openSheet(`<h4>Wake up Spotify</h4><p class="sp-note">${IOS?'Crate’s built-in player didn’t start on this phone'+(sdkErr?' ('+esc(sdkErr)+')':'')+'. As a backup: tap <b style="color:var(--ink)">Open Spotify</b> and start the album playing there. Once it’s playing, Crate’s Play, pause and skip buttons will control it.':'Spotify isn’t running anywhere Crate can reach. Open Spotify on a device for a moment, then come back and tap Play again.'}</p>
  <a class="btn spot" href="${esc(album?.url||'https://open.spotify.com')}" target="_blank" rel="noopener" style="margin-top:12px">Open Spotify</a>
  ${others.length?`<p class="sp-note" style="margin-top:16px">Or play it on:</p><ul class="devlist">${others.map(d=>`<li><button data-id="${esc(d.id)}"><span>${esc(d.name)}<br><small>${esc(d.type)}</small></span></button></li>`).join('')}</ul>`:''}
  <button class="btn ghost" id="spClose" style="margin-top:10px">Close</button>`);
  $('#spClose').onclick=C.closeSheet;
  document.querySelectorAll('.devlist button').forEach(b=>b.onclick=async()=>{
    C.closeSheet();
    try{await api('/me/player/play?device_id='+encodeURIComponent(b.dataset.id),{method:'PUT',body:JSON.stringify({context_uri:album.uri})});C.toast('Playing on '+b.querySelector('span').firstChild.textContent);setTimeout(poll,800)}catch(e){C.toast(e.message)}
  });
}

/* ---------- play ---------- */
async function playRecord(x){
  if(sdkPlayer)try{sdkPlayer.activateElement()}catch(e){}
  C.toast('Finding “'+x.title+'” on Spotify…');
  let album;
  try{album=await findAlbum(x)}catch(e){store.set('spLastErr','search '+(e.status||'')+' '+e.message);C.toast('Spotify search failed: '+e.message);return}
  if(album.pick){pickSheet(x,album.candidates,c=>playAlbum(x,c));return}
  return playAlbum(x,album);
}
async function playAlbum(x,album,trackUri){
  if(sdkPlayer)try{sdkPlayer.activateElement()}catch(e){}
  try{
    let dev=await pickDevice();
    if((!dev||dev.none)&&sdkPlayer&&!sdkDevice){for(let i=0;i<6&&!sdkDevice;i++)await new Promise(r=>setTimeout(r,500));dev=await pickDevice()}
    if(!dev||dev.none){wakeSheet(album,dev?.others||[]);return}
    await api('/me/player/play?device_id='+encodeURIComponent(dev.id),{method:'PUT',body:JSON.stringify(trackUri?{context_uri:album.uri,offset:{uri:trackUri}}:{context_uri:album.uri})});
    C.toast((trackUri?'Playing from that track':'Playing “'+x.title+'”')+' on '+(dev.name||'Spotify'));
    lastRecord=x;setTimeout(poll,800);setTimeout(poll,2500);
  }catch(e){
    store.set('spLastErr',(e.status||'')+' '+(e.reason||'')+' '+e.message);
    if(e.reason==='NO_ACTIVE_DEVICE'||e.status===404)wakeSheet(album);
    else if(e.reason==='PREMIUM_REQUIRED')C.toast('This needs Spotify Premium');
    else C.toast(e.message);
  }
}
let lastRecord=null;
document.addEventListener('click',async e=>{
  const rm=e.target.closest('[data-rematch]');
  if(rm){e.preventDefault();if(!useCrate()){openConnect();return}const x=C.byInst(rm.dataset.rematch);if(!x)return;C.toast('Looking up versions…');try{const r=await findAlbum(x,true);pickSheet(x,r.candidates||[],c=>playAlbum(x,c))}catch(err){C.toast(err.message)}return}
  const tr=e.target.closest('.tracks li[data-n]');
  if(tr&&useCrate()){
    if(sdkPlayer)try{sdkPlayer.activateElement()}catch(err){}
    const x=C.byInst(tr.closest('.tracks').dataset.inst);if(!x)return;
    const n=+tr.dataset.n,title=tr.dataset.title;
    const go=async alb=>{
      let uri=null;
      try{const a=await getAlbum(alb.uri.split(':').pop());const items=a.tracks?.items||[];const nt=norm(title);
        uri=(items.find(t=>norm(t.name)===nt)||items.find(t=>{const m=norm(t.name);return nt&&(m.startsWith(nt)||nt.startsWith(m))})||items[n])?.uri||null}catch(err){}
      playAlbum(x,alb,uri);
    };
    C.toast('Finding “'+title+'”…');
    try{const alb=await findAlbum(x);if(alb.pick)pickSheet(x,alb.candidates,c=>go(c));else go(alb)}catch(err){C.toast(err.message)}
    return;
  }
  const a=e.target.closest('a.spot[data-inst]');
  if(!a||!useCrate())return; // other services and un-set-up Spotify: the link opens the album in that app
  const x=C.byInst(a.dataset.inst);if(!x)return;
  e.preventDefault();
  playRecord(x);
},true);

/* ---------- now playing bar ---------- */
async function poll(){
  clearTimeout(pollT);
  if(!connected())return;
  try{state=await api('/me/player?additional_types=track')}catch(e){state=null}
  polledAt=Date.now();
  renderBar();
  if(document.visibilityState==='visible')pollT=setTimeout(poll,state?.is_playing?5000:15000);
}
function renderBar(){
  const show=!!(state&&state.item);
  $('#bar').classList.toggle('hidden',!show);document.body.classList.toggle('hasbar',show);
  if(!show)return;
  const it=state.item,img=it.album?.images?.slice(-2)[0]?.url;
  const art=$('#barArt');if(img){art.src=img;art.style.visibility='visible'}else art.style.visibility='hidden';
  $('#barT').textContent=it.name;
  $('#barA').textContent=(it.artists||[]).map(a=>a.name).join(', ')+' · '+(it.album?.name||'');
  $('#barDev').textContent='▸ '+(state.device?.name||'Spotify');
  $('#barPlay').innerHTML=state.is_playing?ICON_PAUSE:ICON_PLAY;
  renderNpv();syncPlaying();mediaMeta();
}

/* ---------- now playing view ---------- */
const fmt=ms=>{const t=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
let polledAt=0,seeking=false,endPolled='',albumCache={},shownAlbum='',lastMeta='';
const npvIsOpen=()=>$('#npv').classList.contains('open');
function npvOpen(){if(!state?.item)return;$('#npv').classList.add('open');$('#npv').setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';$('#npv').scrollTop=0;renderNpv();setTimeout(()=>$('#npvClose').focus({preventScroll:true}),60)}
function npvClose(){$('#npv').classList.remove('open');$('#npv').setAttribute('aria-hidden','true');document.documentElement.style.overflow=''}
const curPos=()=>!state?.item?0:Math.min(state.item.duration_ms||0,(state.progress_ms||0)+(state.is_playing?Date.now()-polledAt:0));
function renderNpv(){
  if(!state?.item){if(npvIsOpen())npvClose();return}
  syncPlaying();
  if(!npvIsOpen())return;
  const it=state.item,big=it.album?.images?.[0]?.url||'';
  $('#npv').classList.toggle('playing',!!state.is_playing);
  const bg=big?`url("${big.replace(/"/g,'%22')}")`:'none';
  if($('#npvLabel').style.backgroundImage!==bg){$('#npvLabel').style.backgroundImage=bg;$('#npvBg').style.backgroundImage=bg}
  $('#npvT').textContent=it.name;
  $('#npvA').textContent=(it.artists||[]).map(a=>a.name).join(', ');
  $('#npvAlbum').textContent=it.album?.name||'';
  $('#npvPlay').innerHTML=state.is_playing?ICON_PAUSE:ICON_PLAY;
  $('#npvDur').textContent=fmt(it.duration_ms);
  tick();loadTracks();
}
function tick(){
  if(!state?.item)return;
  const d=state.item.duration_ms||1,p=curPos();
  if(!seeking){$('#npvSeek').value=Math.round(p/d*1000);$('#npvCur').textContent=fmt(p)}
  if(state.is_playing&&p>=d-400&&endPolled!==state.item.id){endPolled=state.item.id;setTimeout(poll,1200)}
}
setInterval(()=>{if(npvIsOpen())tick()},500);
async function getAlbum(id){if(!albumCache[id])albumCache[id]=await api('/albums/'+encodeURIComponent(id));return albumCache[id]}
async function loadTracks(){
  const al=state?.item?.album;if(!al?.id)return;
  if(shownAlbum!==al.id){
    shownAlbum=al.id;$('#npvTracks').innerHTML='';$('#npvListH').textContent='Tracklist';
    let a;try{a=await getAlbum(al.id)}catch(e){$('#npvListH').textContent='Tracklist unavailable';return}
    if(shownAlbum!==al.id)return;
    const items=a.tracks?.items||[],discs=new Set(items.map(t=>t.disc_number)).size;
    $('#npvListH').textContent=`${a.name} · ${items.length} tracks${a.release_date?' · '+a.release_date.slice(0,4):''}`;
    $('#npvTracks').innerHTML=items.map(t=>`<li><button data-uri="${esc(t.uri)}" data-id="${esc(t.id)}" data-album="${esc(a.uri)}"><span class="n">${discs>1?esc(t.disc_number)+'.':''}${esc(t.track_number)}</span><span class="nm">${esc(t.name)}</span><span class="d">${fmt(t.duration_ms)}</span></button></li>`).join('');
  }
  document.querySelectorAll('#npvTracks button').forEach(b=>{const on=b.dataset.id===state.item.id;b.classList.toggle('cur',on);b.setAttribute('aria-current',on?'true':'false')});
}
$('#npvTracks').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-uri]');if(!b)return;
  if(sdkPlayer)try{sdkPlayer.activateElement()}catch(err){}
  try{await api('/me/player/play'+(state?.device?.id?'?device_id='+encodeURIComponent(state.device.id):''),{method:'PUT',body:JSON.stringify({context_uri:b.dataset.album,offset:{uri:b.dataset.uri}})})}catch(err){C.toast(err.message)}
  setTimeout(poll,500);
});
$('#npvSeek').addEventListener('input',()=>{seeking=true;if(state?.item)$('#npvCur').textContent=fmt(+$('#npvSeek').value/1000*state.item.duration_ms)});
$('#npvSeek').addEventListener('change',async()=>{
  if(!state?.item){seeking=false;return}
  const pos=Math.round(+$('#npvSeek').value/1000*state.item.duration_ms);
  state.progress_ms=pos;polledAt=Date.now();seeking=false;
  try{await api('/me/player/seek?position_ms='+pos,{method:'PUT'})}catch(e){C.toast(e.message)}
});
function togglePlay(){
  if(sdkPlayer)try{sdkPlayer.activateElement()}catch(e){}
  if(!state)return;
  state.progress_ms=curPos();polledAt=Date.now();
  ctl(state.is_playing?'/me/player/pause':'/me/player/play','PUT');
  state.is_playing=!state.is_playing;renderBar();
}
$('#npvPlay').onclick=togglePlay;
$('#npvNext').onclick=()=>ctl('/me/player/next','POST');
$('#npvPrev').onclick=()=>{if(curPos()>4000){state.progress_ms=0;polledAt=Date.now();ctl('/me/player/seek?position_ms=0','PUT')}else ctl('/me/player/previous','POST')};
$('#npvClose').onclick=npvClose;
$('#npvSpk').onclick=deviceSheet;
$('#barArt').addEventListener('click',npvOpen);
$('#bar .info').addEventListener('click',e=>{if(!e.target.closest('#barDev'))npvOpen()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&npvIsOpen()&&!$('#sheet').classList.contains('open'))npvClose()});
{let y0=null;const v=$('#npv');
 v.addEventListener('touchstart',e=>{y0=v.scrollTop<=0&&!e.target.closest('input')?e.touches[0].clientY:null},{passive:true});
 v.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>110)npvClose();y0=null},{passive:true});}

/* which record in the collection is playing */
function syncPlaying(){
  if(!C.markPlaying)return;
  const uri=state?.item?.album?.uri;let id=null;
  if(uri){const cache=store.get('spAlbums')||{};for(const k in cache){if(cache[k]?.uri===uri){id=+k;break}}}
  C.markPlaying(id,!!state?.is_playing);
  if(id&&state?.is_playing)logPlay(id);
}
function logPlay(id){
  const log=store.get('plays')||[];
  const recent=log.findLast?log.findLast(p=>p.id===id):[...log].reverse().find(p=>p.id===id);
  if(recent&&Date.now()-recent.at<45*60000)return;
  log.push({id,at:Date.now()});if(log.length>5000)log.splice(0,log.length-5000);
  store.set('plays',log);
}
/* lock screen / control centre info */
function mediaMeta(){
  if(!('mediaSession' in navigator)||!state?.item)return;
  const it=state.item;
  try{navigator.mediaSession.playbackState=state.is_playing?'playing':'paused'}catch(e){}
  if(lastMeta===it.id)return;lastMeta=it.id;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:it.name,artist:(it.artists||[]).map(a=>a.name).join(', '),album:it.album?.name||'',artwork:(it.album?.images||[]).map(i=>({src:i.url,sizes:`${i.width}x${i.height}`,type:'image/jpeg'}))})}catch(e){}
}
if('mediaSession' in navigator){
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>{if(state&&!state.is_playing)togglePlay()});h('pause',()=>{if(state?.is_playing)togglePlay()});
  h('nexttrack',()=>ctl('/me/player/next','POST'));h('previoustrack',()=>ctl('/me/player/previous','POST'));
}
async function ctl(path,method){
  try{await api(path,{method});}catch(e){C.toast(e.message)}
  setTimeout(poll,400);
}
$('#barPlay').onclick=()=>togglePlay();
$('#barNext').onclick=()=>ctl('/me/player/next','POST');
$('#barPrev').onclick=()=>ctl('/me/player/previous','POST');
$('#barDev').onclick=e=>{e.stopPropagation();deviceSheet()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});

async function deviceSheet(){
  let list=[];try{list=await devices()}catch(e){C.toast(e.message);return}
  if(sdkDevice&&!list.some(d=>d.id===sdkDevice))list.unshift({id:sdkDevice,name:'Crate (this '+(IOS?'phone':'browser')+')',type:IOS?'Smartphone':'Computer'});
  C.openSheet(`<h4>Play on</h4>${list.length?`<ul class="devlist">${list.map(d=>`<li><button data-id="${esc(d.id)}" class="${d.is_active?'on':''}"><span>${esc(d.name)}<br><small>${esc(d.type)}</small></span>${d.is_active?'<small>Playing</small>':''}</button></li>`).join('')}</ul>`:'<p class="sp-note">No Spotify devices are awake. Open Spotify on your phone, computer or speaker and it will show up here.</p>'}
  <button class="btn ghost" id="spClose">Close</button>`);
  $('#spClose').onclick=C.closeSheet;
  document.querySelectorAll('.devlist button').forEach(b=>b.onclick=async()=>{
    store.set('spDevice',b.dataset.id);C.closeSheet();
    try{await api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[b.dataset.id],play:true})});C.toast('Switched speaker')}catch(e){C.toast(e.message)}
    setTimeout(poll,800);
  });
}

/* ---------- connect sheet ---------- */
async function openConnect(){
  if(connected()){
    let me=null;try{me=await api('/me')}catch(e){}
    C.openSheet(`<h4>Spotify</h4><p class="sp-note">Connected${me?' as <b style="color:var(--ink)">'+esc(me.display_name||me.id)+'</b>':''}. The green Play buttons now play albums right here in Crate.</p>
    <button class="btn spot" id="spDiag">Check connection</button><pre id="diagOut" class="sp-note" style="white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:12px;padding:12px;display:none"></pre>
    <div class="row2"><button class="btn ghost" id="spDev">Choose speaker</button><button class="btn ghost" id="spOut">Disconnect</button></div>
    <button class="btn ghost" id="spClose" style="margin-top:10px">Close</button>`);
    $('#spDev').onclick=deviceSheet;
    $('#spDiag').onclick=runDiag;
    $('#spOut').onclick=()=>{sp={clientId:sp.clientId};save();store.del('spDevice');if(sdkPlayer){sdkPlayer.disconnect();sdkPlayer=null;window.__spLoading=0}state=null;renderBar();updateUI();C.closeSheet();C.toast('Spotify disconnected')};
  }else{
    C.openSheet(`<h4>Play inside Crate with Spotify</h4>
    <p class="sp-note">Spotify only lets apps like Crate play music for people who set up their own free “developer app”. It takes about 5 minutes, is easiest on a computer, and needs <b style="color:var(--ink)">Spotify Premium</b>.</p>
    <ol class="steps">
      <li>Go to <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a> and log in with your Spotify account. Accept the terms if asked.</li>
      <li>Click <b>Create app</b>. Use any name and description, like “My Crate”.</li>
      <li>Under <b>Redirect URIs</b>, paste this address exactly and click <b>Add</b>:
        <div class="copyrow"><code id="spRedir">${esc(REDIRECT)}</code><button id="spCopy">Copy</button></div></li>
      <li>Under <b>Which API/SDKs are you planning to use?</b>, tick <b>Web API</b> and <b>Web Playback SDK</b>. Tick the terms box and click <b>Save</b>.</li>
      <li>On your new app’s page, open <b>Settings</b>, copy the <b>Client ID</b> and paste it below. You don’t need the Client Secret.</li>
    </ol>
    <label class="field"><span>Spotify Client ID</span><input id="spCid" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(clientId())}" placeholder="32 letters and numbers"></label>
    <button class="btn spot" id="spGo">Connect Spotify</button>
    <button class="btn ghost" id="spClose" style="margin-top:10px">Close</button>`);
    $('#spCopy').onclick=async()=>{try{await navigator.clipboard.writeText(REDIRECT);$('#spCopy').textContent='Copied'}catch(e){const r=document.createRange();r.selectNodeContents($('#spRedir'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);C.toast('Selected. Copy it from here.')}};
    $('#spGo').onclick=()=>{const v=$('#spCid').value.trim();if(v)store.set('service','spotify');if(!/^[0-9a-f]{32}$/i.test(v)){C.toast('That doesn’t look like a Client ID');return}sp.clientId=v;save();login()};
  }
  $('#spClose').onclick=C.closeSheet;
}
async function runDiag(){
  const out=$('#diagOut');out.style.display='block';const L=[];const w=t=>{L.push(t);out.textContent=L.join('\n')};
  w('Device: '+(IOS?'iPhone/iPad':'computer')+(navigator.standalone?' (Home Screen app)':''));
  try{await token();w('✓ Signed in to Spotify')}catch(e){w('✗ Sign-in: '+e.message);return}
  try{const me=await api('/me');w('✓ Account: '+(me.display_name||me.id)+(me.product?' · plan: '+me.product:''))}catch(e){w('✗ Account: '+e.message+(e.status?' ('+e.status+')':''))}
  try{const d=await devices();w((d.length?'✓':'✗')+' Spotify devices awake: '+(d.map(x=>x.name+(x.is_active?' (active)':'')).join(', ')||'none'))}catch(e){w('✗ Devices: '+e.message+' ('+e.status+')')}
  w((sdkDevice?'✓':'✗')+' Crate player: '+(sdkDevice?'ready':(sdkPlayer?'starting / not ready':'not loaded'))+(sdkErr?' · '+sdkErr:''));
  const x=C.current;
  if(x){try{store.set('spAlbums',{});const a=await findAlbum(x);w(a?'✓ Found “'+a.name+'” for '+x.title:'✗ No Spotify match for '+x.title)}catch(e){w('✗ Search: '+e.message+' ('+e.status+')')}}
  try{const st=await api('/me/player');w('Now: '+(st?.item?(st.is_playing?'playing ':'paused ')+st.item.name+' on '+st.device?.name:'nothing playing'))}catch(e){w('✗ Player: '+e.message+' ('+e.status+')')}
  w('Last play error: '+(store.get('spLastErr')||'none'));
}
window.CrateSpotify={open:openConnect,connected,play:x=>playRecord(x)};
function updateUI(){C.applyService();if(!connected()){state=null;C.markPlaying&&C.markPlaying(null,false)}}

handleRedirect().then(()=>{
  if(!store.get('service')&&connected())store.set('service','spotify');
  updateUI();if(connected()){startPlayer();poll()}
  if(!store.get('service'))setTimeout(C.firstRun,800);
});
}
</script>
